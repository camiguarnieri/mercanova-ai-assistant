# Sirve los archivos que compiló Vite.
#
# No hay proxy al backend, a propósito: a la API la llama el navegador de la
# máquina anfitriona, directo al puerto 8000 que publica el compose. Pasar los
# pedidos por acá agregaría una pieza más que explicar y cambiaría el origen de
# los pedidos, que es justo lo que FRONTEND_ORIGINS tiene configurado.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicación es una sola página con pestañas, sin router, así que hoy
    # solo se pide "/". El try_files está igual para que una recarga sobre
    # cualquier ruta devuelva la aplicación en vez de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite les pone un hash en el nombre, así que un archivo con un nombre dado
    # nunca cambia de contenido y se puede cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html no se cachea: es el que apunta a los assets con hash, y si el
    # navegador se queda con uno viejo sigue pidiendo la versión anterior.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
